services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: blackbox-falkordb
    ports:
      - "6379:6379"
      - "3000:3000" # Browser UI
    environment:
      # No password by default (dev). For shared machines add:
      # - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-falkordb} --appendonly yes
      - FALKORDB_ARGS=THREAD_COUNT 4
    volumes:
      - falkor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  falkor-data: {}
