services:
  falkordb:
    image: falkordb/falkordb:v4.14.6   # the version every number in the README was measured on
    container_name: blackbox-falkordb
    ports:
      - "6379:6379"
      - "3000:3000" # Browser UI
    environment:
      # No password by default (dev). For shared machines add:
      # - REDIS_ARGS=--requirepass ${FALKORDB_PASSWORD:-falkordb} --appendonly yes
      # TIMEOUT: reads over 1 s fail instead of queueing (writes are not limited)
      - FALKORDB_ARGS=THREAD_COUNT 4 MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000
    volumes:
      - falkor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  falkor-data: {}
